name: Set up browser checks
description: Install the locked Playwright version and reuse its Chromium download
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: tests/browser/package-lock.json

    - name: Install browser checks
      shell: bash
      run: npm ci --prefix tests/browser --no-audit --no-fund

    - name: Cache headless Chromium
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('tests/browser/package-lock.json') }}

    # OS libraries are still checked on cache hits; only the browser download is cached.
    - name: Install headless Chromium
      shell: bash
      working-directory: tests/browser
      run: npx playwright install --with-deps --only-shell chromium

name: Build, test and deploy WorldBox

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run integration, long simulations and all browser regressions
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: worldbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json') }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ hashFiles('global.json') }}-

      - name: Restore
        run: dotnet restore scripts/ci-build.slnf

      # Compile native checks here; the Browser project is built once by publish.
      - name: Build desktop and test projects
        run: dotnet build scripts/ci-build.slnf -c Release --no-restore

      - name: Run unit and headless UI checks
        run: python3 scripts/run-fast-tests.py

      - name: Test simulation integration
        if: inputs.full_regression == true
        run: dotnet tests/SeWZC.WorldBox.Core.Tests/bin/Release/net10.0/SeWZC.WorldBox.Core.Tests.dll --suite integration

      - name: Test long simulations and mixed edits
        if: inputs.full_regression == true
        run: dotnet tests/SeWZC.WorldBox.Core.Tests/bin/Release/net10.0/SeWZC.WorldBox.Core.Tests.dll --suite long

      - name: Prepare large save fixture
        if: inputs.full_regression == true
        run: dotnet tests/SeWZC.WorldBox.Core.Tests/bin/Release/net10.0/SeWZC.WorldBox.Core.Tests.dll --export-browser-fixture artifacts/save-fixture/world.worldbox.json

      - name: Upload save fixture
        if: inputs.full_regression == true
        uses: actions/upload-artifact@v4
        with:
          name: worldbox-save-fixture
          path: artifacts/save-fixture

  publish:
    name: Publish and check static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json') }}-browser-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ hashFiles('global.json') }}-browser-
            ${{ runner.os }}-nuget-${{ hashFiles('global.json') }}-

      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Restore browser project
        run: dotnet restore src/SeWZC.WorldBox.Browser/SeWZC.WorldBox.Browser.csproj

      - name: Publish and check static site
        run: bash scripts/publish-browser.sh --no-restore

      - name: Upload static site for browser checks and review
        uses: actions/upload-artifact@v4
        with:
          name: worldbox-static-site
          path: artifacts/site
          include-hidden-files: true
          compression-level: 0

      - name: Prepare GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/site

  browser:
    name: Browser (${{ matrix.suite }})
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Keep normal pushes and PRs short; the manual option retains every regression.
        suite: ${{ fromJSON(inputs.full_regression == true && '["deploy-smoke", "smoke", "mobile-smoke", "motion", "stories", "effects", "advancement", "land", "details", "saving"]' || '["deploy-smoke"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: worldbox-static-site
          path: artifacts/browser-preview/SeWZC.SandboxGame

      - uses: actions/download-artifact@v4
        if: matrix.suite == 'saving'
        with:
          name: worldbox-save-fixture
          path: artifacts/save-fixture

      - uses: ./.github/actions/setup-browser

      # Separate runners prevent motion/effects measurements competing for CPU.
      - name: Test published site under its GitHub Pages path
        env:
          WORLDBOX_BASE_URL: http://127.0.0.1:8080/SeWZC.SandboxGame/
          WORLDBOX_EXPECTED_REVISION: ${{ github.sha }}
          BROWSER_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/browser-tests
          python3 -m http.server 8080 --bind 127.0.0.1 --directory artifacts/browser-preview > artifacts/browser-tests/http.log 2>&1 &
          worldbox_server_pid=$!
          trap 'kill "$worldbox_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent "$WORLDBOX_BASE_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$WORLDBOX_BASE_URL" > /dev/null
          worldbox_suite_args=()
          if [[ "$BROWSER_SUITE" == saving ]]; then
            worldbox_suite_args+=(artifacts/save-fixture/world.worldbox.json)
          fi
          node "tests/browser/$BROWSER_SUITE.cjs" "${worldbox_suite_args[@]}" 2>&1 | tee "artifacts/browser-tests/$BROWSER_SUITE.log"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldbox-browser-tests-${{ matrix.suite }}
          path: artifacts/browser-tests
          if-no-files-found: ignore

  deploy:
    name: Deploy main to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, publish, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: Verify deployed game
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORLDBOX_BASE_URL: ${{ needs.deploy.outputs.page_url }}
      WORLDBOX_EXPECTED_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-browser

      - name: Test deployed revision, startup and save recovery
        run: |
          set -euo pipefail
          mkdir -p artifacts/browser-tests
          npm run test:deploy --prefix tests/browser 2>&1 | tee artifacts/browser-tests/deploy-smoke.log

      - name: Upload live browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldbox-live-browser-tests
          path: artifacts/browser-tests
          if-no-files-found: ignore

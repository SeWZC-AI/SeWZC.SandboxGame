name: Build, test and deploy WorldBox

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worldbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json') }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ hashFiles('global.json') }}-

      - name: Restore
        run: dotnet restore scripts/ci-build.slnf

      # 此处构建原生检查；浏览器项目由发布步骤构建。
      - name: Build desktop and test projects
        run: dotnet build scripts/ci-build.slnf -c Release --no-restore

      - name: Run unit tests
        run: dotnet test scripts/ci-build.slnf -c Release --no-build --no-restore --logger "trx;LogFilePrefix=unit" --results-directory artifacts/unit-tests

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldbox-unit-tests
          path: artifacts/unit-tests
          if-no-files-found: ignore

  publish:
    name: Publish and check static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json') }}-browser-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/NuGet.Config', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ hashFiles('global.json') }}-browser-
            ${{ runner.os }}-nuget-${{ hashFiles('global.json') }}-

      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools --skip-manifest-update

      - name: Restore browser project
        run: dotnet restore src/SeWZC.WorldBox.Browser/SeWZC.WorldBox.Browser.csproj

      - name: Publish and check static site
        run: bash scripts/publish-browser.sh --no-restore

      - name: Upload static site for review
        uses: actions/upload-artifact@v4
        with:
          name: worldbox-static-site
          path: artifacts/site
          include-hidden-files: true
          compression-level: 0

      - name: Prepare GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/site

  deploy:
    name: Deploy main to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
